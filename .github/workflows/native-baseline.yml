name: Update native baseline
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      commit:
        description: Default-branch commit to publish (blank uses current revision)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: native-baseline-${{ inputs.commit || github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Holonic-Technologies/ftgo-application' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Publish and verify the default-branch native baseline
        env:
          API_URL: https://qgd63ljozc.execute-api.us-east-1.amazonaws.com/demo/verify-checks-holonic
          API_KEY: ${{ secrets.DRIFT_GATE_API_KEY }}
          COMMIT: ${{ inputs.commit || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          url = os.environ['API_URL']
          payload = {'operation': 'publish-native-baseline', 'repository': os.environ['REPOSITORY'], 'commit': os.environ['COMMIT']}
          headers = {'x-api-key': os.environ['API_KEY'], 'Content-Type': 'application/json'}
          request = urllib.request.Request(url, data=json.dumps(payload).encode(), headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 202
          query = urllib.parse.urlencode({k: payload[k] for k in ('repository', 'commit')})
          for attempt in range(96):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url + '?' + query, headers=headers), timeout=30) as response:
                      record = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504):
                      raise
                  print('Readiness endpoint temporarily unavailable; retrying HTTP ' + str(error.code), flush=True)
                  time.sleep(10)
                  continue
              except (urllib.error.URLError, TimeoutError):
                  print('Readiness network request failed temporarily; retrying.', flush=True)
                  time.sleep(10)
                  continue
              if record.get('state') == 'ready' and record.get('commit') == payload['commit']:
                  print(json.dumps(record, indent=2))
                  break
              print('Waiting for native baseline publication...', flush=True)
              time.sleep(10)
          else:
              raise SystemExit('Native baseline publication did not complete; inspect the publisher logs and retry')
          PY
